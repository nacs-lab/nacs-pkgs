name: Publish

# Publish the packages built for one platform to its package repository on the gh-pages branch
# and commit the updated package versions back to master.

on:
  workflow_call:
    inputs:
      ref:
        description: Commit the packages were built from
        type: string
        required: true
      platform:
        description: archlinux, archlinux-arm, msys2, msys2-ucrt64 or msys2-clang64
        type: string
        required: true
    outputs:
      published:
        description: Space separated list of the package directories published
        value: ${{ jobs.publish.outputs.published }}

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    # The signing key is stored in the environment, which is limited to the master branch.
    environment: package-signing
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      # git needs to be installed before checkout to get a git repository
      - name: Install dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm git
          # The workspace is owned by the runner user rather than root
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: '*-package-${{ inputs.platform }}'
          path: ../artifacts

      - name: Import signing key
        env:
          PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
          PACKAGE_SIGNING_PASSPHRASE: ${{ secrets.PACKAGE_SIGNING_PASSPHRASE }}
        run: bash github/import-signing-key.sh

      - name: Update package repository
        id: publish
        run: bash github/publish-packages.sh "${{ inputs.platform }}" ../artifacts

      - name: Commit package versions
        run: bash github/push-master.sh "Update ${{ inputs.platform }} packages"
