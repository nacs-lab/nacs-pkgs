name: Update

# Check for package updates, build the packages that need to be updated
# and publish them to the pacman repositories on the gh-pages branch.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'
  push:
    branches: [ master ]

concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    name: Check for updates
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    outputs:
      ref: ${{ steps.commit.outputs.ref }}
      archlinux: ${{ steps.check.outputs.archlinux }}
      archlinux-arm: ${{ steps.check.outputs.archlinux-arm }}
      msys2: ${{ steps.check.outputs.msys2 }}
    steps:
      # git needs to be installed before checkout to get a git repository
      - name: Install dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm git nvchecker
          # The workspace is owned by the runner user rather than root
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: List published packages
        run: |
          git ls-remote --exit-code --heads origin gh-pages && ret=0 || ret=$?
          if [[ $ret = 0 ]]; then
              git fetch --depth 1 --filter=blob:none origin gh-pages
              git ls-tree -r --name-only FETCH_HEAD > ../published.txt
          elif [[ $ret = 2 ]]; then
              # Not published yet
              : > ../published.txt
          else
              exit $ret
          fi

      - name: Check for updates
        id: check
        run: python github/check-updates.py --published ../published.txt

      - name: Commit pkgrel bumps
        id: commit
        run: |
          bash github/push-master.sh "Rebuild packages for updated dependencies"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  archlinux:
    name: ArchLinux
    needs: check
    if: needs.check.outputs.archlinux != ''
    uses: ./.github/workflows/archlinux.yml
    with:
      ref: ${{ needs.check.outputs.ref }}
      build: ${{ needs.check.outputs.archlinux }}

  archlinux-arm:
    name: ArchLinux ARM
    needs: check
    if: needs.check.outputs.archlinux-arm != ''
    uses: ./.github/workflows/archlinux-arm.yml
    with:
      ref: ${{ needs.check.outputs.ref }}
      build: ${{ needs.check.outputs.archlinux-arm }}

  msys2:
    name: MSYS2
    needs: check
    if: needs.check.outputs.msys2 != ''
    uses: ./.github/workflows/msys2.yml
    with:
      ref: ${{ needs.check.outputs.ref }}
      build: ${{ needs.check.outputs.msys2 }}

  # Publish each platform separately so that a failure in one doesn't block the others.
  # Packages that were built successfully are published even if other builds failed.
  # The failed ones will be retried in the next run.
  publish-archlinux:
    name: Publish ArchLinux
    needs: [check, archlinux]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.check.outputs.archlinux != '' }}
    uses: ./.github/workflows/publish.yml
    with:
      ref: ${{ needs.check.outputs.ref }}
      platform: archlinux

  publish-archlinux-arm:
    name: Publish ArchLinux ARM
    needs: [check, archlinux-arm]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.check.outputs.archlinux-arm != '' }}
    uses: ./.github/workflows/publish.yml
    with:
      ref: ${{ needs.check.outputs.ref }}
      platform: archlinux-arm

  publish-msys2:
    name: Publish MSYS2
    needs: [check, msys2]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.check.outputs.msys2 != '' }}
    uses: ./.github/workflows/publish.yml
    with:
      ref: ${{ needs.check.outputs.ref }}
      platform: msys2
