name: Update

# Check for package updates, build the packages that need to be updated
# and publish them to the pacman repositories on the gh-pages branch.
#
# The versions from the sources of the packages (`*/*/nvchecker.yml`)
# at the last successful build are kept in the cache.
# Since the cache is evicted if it's not used for 7 days, the state is also uploaded
# as an artifact (kept for 90 days) and used when the cache isn't available.
# See `github/check-updates.py` for details.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'
  push:
    branches: [ master ]

concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: write
  # For downloading the state from previous runs
  actions: read

env:
  STATE_DIR: nvchecker-state

jobs:
  check:
    name: Check for updates
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    outputs:
      archlinux: ${{ steps.check.outputs.archlinux }}
      archlinux-arm: ${{ steps.check.outputs.archlinux-arm }}
      msys2: ${{ steps.check.outputs.msys2 }}
    steps:
      - name: Install dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm git nvchecker python-yaml
      - uses: actions/checkout@v7

      - name: Restore recorded versions
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.STATE_DIR }}
          key: nvchecker-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: nvchecker-state-
      - name: Restore recorded versions from previous runs
        if: steps.cache.outputs.cache-matched-key == ''
        uses: dawidd6/action-download-artifact@v28
        with:
          workflow: update.yml
          branch: ${{ github.ref_name }}
          # Include runs with failed builds since the successful ones are still recorded.
          workflow_conclusion: completed
          name: nvchecker-state-recorded
          search_artifacts: true
          if_no_artifact_found: warn
          path: ${{ env.STATE_DIR }}

      - name: Check for updates
        id: check
        run: python github/check-updates.py --state-dir "$STATE_DIR" check

      # The versions are only recorded after the packages are published.
      - name: Upload state
        uses: actions/upload-artifact@v7
        with:
          name: nvchecker-state
          path: ${{ env.STATE_DIR }}
          overwrite: true

  archlinux:
    name: ArchLinux
    needs: check
    if: needs.check.outputs.archlinux != ''
    uses: ./.github/workflows/archlinux.yml
    with:
      ref: ${{ github.sha }}
      build: ${{ needs.check.outputs.archlinux }}

  archlinux-arm:
    name: ArchLinux ARM
    needs: check
    if: needs.check.outputs.archlinux-arm != ''
    uses: ./.github/workflows/archlinux-arm.yml
    with:
      ref: ${{ github.sha }}
      build: ${{ needs.check.outputs.archlinux-arm }}

  msys2:
    name: MSYS2
    needs: check
    if: needs.check.outputs.msys2 != ''
    uses: ./.github/workflows/msys2.yml
    with:
      ref: ${{ github.sha }}
      build: ${{ needs.check.outputs.msys2 }}

  # Publish each platform separately so that a failure in one doesn't block the others.
  # Packages that were built successfully are published even if other builds failed.
  # The failed ones will be retried in the next run.
  publish-archlinux:
    name: Publish ArchLinux
    needs: [check, archlinux]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.check.outputs.archlinux != '' }}
    uses: ./.github/workflows/publish.yml
    with:
      ref: ${{ github.sha }}
      platform: archlinux

  publish-archlinux-arm:
    name: Publish ArchLinux ARM
    needs: [check, archlinux-arm]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.check.outputs.archlinux-arm != '' }}
    uses: ./.github/workflows/publish.yml
    with:
      ref: ${{ github.sha }}
      platform: archlinux-arm

  publish-msys2:
    name: Publish MSYS2
    needs: [check, msys2]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.check.outputs.msys2 != '' }}
    uses: ./.github/workflows/publish.yml
    with:
      ref: ${{ github.sha }}
      platform: msys2

  # Record the versions of the published packages in one place
  # since the cache can't be updated by multiple jobs.
  record:
    name: Record versions
    needs: [check, publish-archlinux, publish-archlinux-arm, publish-msys2]
    if: ${{ !cancelled() && needs.check.result == 'success' }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm nvchecker
      - uses: actions/checkout@v7

      - name: Download state
        uses: actions/download-artifact@v8
        with:
          name: nvchecker-state
          path: ${{ env.STATE_DIR }}

      - name: Record versions
        env:
          PUBLISHED: >-
            ${{ needs.publish-archlinux.outputs.published }}
            ${{ needs.publish-archlinux-arm.outputs.published }}
            ${{ needs.publish-msys2.outputs.published }}
        run: python github/check-updates.py --state-dir "$STATE_DIR" record "$PUBLISHED"

      - name: Upload recorded versions
        uses: actions/upload-artifact@v7
        with:
          name: nvchecker-state-recorded
          path: ${{ env.STATE_DIR }}
          retention-days: 90
          overwrite: true
      - name: Save recorded versions
        uses: actions/cache/save@v6
        with:
          path: ${{ env.STATE_DIR }}
          key: nvchecker-state-${{ github.run_id }}-${{ github.run_attempt }}
