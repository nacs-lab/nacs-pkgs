name: ArchLinux

on:
  workflow_dispatch:
  pull_request:
    branches: [ master ]
  workflow_call:
    inputs:
      ref:
        description: Commit to build
        type: string
      build:
        description: >-
          Space separated list of packages to build.
          Other packages are taken from the package repository.
        type: string

env:
  PACKAGER: "Ni Lab <niharvardlab@gmail.com>"

jobs:
  build-libnacs:
    name: Build libnacs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    container:
      image: archlinux:base-devel
      options: --privileged
      volumes:
        - /sys/fs/cgroup:/sys/fs/cgroup
    env:
      BUILD: ${{ !inputs.build || contains(format(' {0} ', inputs.build), ' libnacs-git ') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Initialize ArchLinux
        if: env.BUILD == 'true'
        run: |
          bash github/setup-archlinux.sh
          chown -R user .
      - name: Setup ArchLinux CN repo
        if: env.BUILD == 'true'
        # For sleef
        run: |
          bash github/setup-archlinux-cn.sh
      - name: Create package
        if: env.BUILD == 'true'
        run: |
          cd arch/libnacs-git
          MAKEFLAGS="-j$(nproc)" sudo -u user makepkg -si --noconfirm
      - name: Fetch published package
        if: env.BUILD != 'true'
        run: |
          bash github/fetch-published.sh archlinux/x86_64 arch/libnacs-git 'libnacs-git-*'

      - name: "Upload binaries"
        uses: actions/upload-artifact@v7
        with:
          name: libnacs-git-package-archlinux
          path: |
            arch/libnacs-git/*.pkg.*
            arch/libnacs-git/PKGBUILD

  build-python-libnacs:
    name: Build python-libnacs
    needs: build-libnacs
    if: ${{ !inputs.build || contains(format(' {0} ', inputs.build), ' python-libnacs-git ') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    container:
      image: archlinux:base-devel
      options: --privileged
      volumes:
        - /sys/fs/cgroup:/sys/fs/cgroup
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Initialize ArchLinux
        run: |
          bash github/setup-archlinux.sh
          chown -R user .
      - name: Setup ArchLinux CN repo
        # For sleef
        run: |
          bash github/setup-archlinux-cn.sh

      - name: Download libnacs
        uses: actions/download-artifact@v8
        with:
          name: libnacs-git-package-archlinux
          path: libnacs-package

      - name: Create package
        run: |
          cd arch/python-libnacs-git
          pacman -U --noconfirm ../../libnacs-package/*.pkg.*
          MAKEFLAGS="-j$(nproc)" sudo -u user makepkg -si --noconfirm

      - name: "Upload binaries"
        uses: actions/upload-artifact@v7
        with:
          name: python-libnacs-git-package-archlinux
          path: |
            arch/python-libnacs-git/*.pkg.*
            arch/python-libnacs-git/PKGBUILD

  build-molecube2:
    name: Build molecube2
    needs: build-libnacs
    if: ${{ !inputs.build || contains(format(' {0} ', inputs.build), ' molecube2-git ') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    container:
      image: archlinux:base-devel
      options: --privileged
      volumes:
        - /sys/fs/cgroup:/sys/fs/cgroup
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Initialize ArchLinux
        run: |
          bash github/setup-archlinux.sh
          chown -R user .
      - name: Setup ArchLinux CN repo
        # For sleef
        run: |
          bash github/setup-archlinux-cn.sh

      - name: Download libnacs
        uses: actions/download-artifact@v8
        with:
          name: libnacs-git-package-archlinux
          path: libnacs-package

      - name: Create package
        run: |
          cd arch/molecube2-git
          pacman -U --noconfirm ../../libnacs-package/*.pkg.*
          MAKEFLAGS="-j$(nproc)" sudo -u user makepkg -si --noconfirm

      - name: "Upload binaries"
        uses: actions/upload-artifact@v7
        with:
          name: molecube2-git-package-archlinux
          path: |
            arch/molecube2-git/*.pkg.*
            arch/molecube2-git/PKGBUILD

  build-labctrl-node:
    name: Build labctrl-node
    needs: build-libnacs
    if: ${{ !inputs.build || contains(format(' {0} ', inputs.build), ' labctrl-node-git ') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    container:
      image: archlinux:base-devel
      options: --privileged
      volumes:
        - /sys/fs/cgroup:/sys/fs/cgroup
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Initialize ArchLinux
        run: |
          bash github/setup-archlinux.sh
          chown -R user .
      - name: Setup ArchLinux CN repo
        # For sleef
        run: |
          bash github/setup-archlinux-cn.sh

      - name: Download libnacs
        uses: actions/download-artifact@v8
        with:
          name: libnacs-git-package-archlinux
          path: libnacs-package

      - name: Create package
        run: |
          cd arch/labctrl-node-git
          pacman -U --noconfirm ../../libnacs-package/*.pkg.*
          pacman -S --noconfirm nodejs-lts-jod
          MAKEFLAGS="-j$(nproc)" sudo -u user makepkg -si --noconfirm

      - name: "Upload binaries"
        uses: actions/upload-artifact@v7
        with:
          name: labctrl-node-git-package-archlinux
          path: |
            arch/labctrl-node-git/*.pkg.*
            arch/labctrl-node-git/PKGBUILD

  build-libspcm:
    name: Build libspcm
    if: ${{ !inputs.build || contains(format(' {0} ', inputs.build), ' libspcm ') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    container:
      image: archlinux:base-devel
      options: --privileged
      volumes:
        - /sys/fs/cgroup:/sys/fs/cgroup
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Initialize ArchLinux
        run: |
          bash github/setup-archlinux.sh
          chown -R user .
      - name: Create package
        run: |
          cd arch/libspcm
          MAKEFLAGS="-j$(nproc)" sudo -u user makepkg -si --noconfirm

      - name: "Upload binaries"
        uses: actions/upload-artifact@v7
        with:
          name: libspcm-package-archlinux
          path: |
            arch/libspcm/*.pkg.*
            arch/libspcm/PKGBUILD
