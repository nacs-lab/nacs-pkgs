name: MSYS2

on:
  workflow_dispatch:
  pull_request:
    branches: [ master ]
  workflow_call:
    inputs:
      ref:
        description: Commit to build
        type: string
      build:
        description: >-
          Space separated list of packages to build.
          Other packages are taken from the package repository.
        type: string

env:
  CC: /mingw64/bin/gcc
  CXX: /mingw64/bin/g++
  PACKAGER: "Ni Lab <niharvardlab@gmail.com>"

jobs:
  build-sleef:
    name: Build Sleef
    runs-on: windows-latest
    strategy:
      fail-fast: false
    env:
      BUILD: ${{ !inputs.build || contains(format(' {0} ', inputs.build), ' mingw-w64-sleef-git ') }}

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.ref }}

    - uses: msys2/setup-msys2@v2
      if: env.BUILD == 'true'
      with:
        msystem: MINGW64
        install: >-
          git
          make
          patch
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-clang
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-libwinpthread

    - name: Build
      if: env.BUILD == 'true'
      shell: msys2 {0}
      run: |
        cd windows/mingw-w64-sleef-git
        MAKEFLAGS="-j$(nproc)" MINGW_ARCH=MINGW64 bash ../../github/build-package.sh msys2/mingw64 makepkg-mingw

    - name: Fetch published package
      if: env.BUILD != 'true'
      shell: bash
      run: |
        bash github/fetch-published.sh msys2/mingw64 windows/mingw-w64-sleef-git 'mingw-w64-x86_64-sleef-git-*'

    - name: "Upload binaries"
      uses: actions/upload-artifact@v7
      with:
        name: mingw-w64-x86_64-sleef-git-package-msys2
        path: |
          windows/mingw-w64-sleef-git/*.pkg.tar.*
          windows/mingw-w64-sleef-git/PKGBUILD

  build-libnacs:
    name: Build libnacs
    runs-on: windows-latest
    strategy:
      fail-fast: false
    needs: build-sleef
    if: ${{ !inputs.build || contains(format(' {0} ', inputs.build), ' mingw-w64-libnacs-git ') }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.ref }}

    - uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        install: >-
          git
          make
          patch
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-clang
          mingw-w64-x86_64-cppzmq
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-tbb
          mingw-w64-x86_64-libwinpthread
          mingw-w64-x86_64-llvm
          mingw-w64-x86_64-openlibm
          mingw-w64-x86_64-polly
          mingw-w64-x86_64-yaml-cpp
          mingw-w64-x86_64-zeromq

    - name: Download Sleef
      uses: actions/download-artifact@v8
      with:
        name: mingw-w64-x86_64-sleef-git-package-msys2
        path: sleef-package

    - name: Install Sleef
      shell: msys2 {0}
      run: |
        pacman -U --noconfirm sleef-package/*.pkg.tar.*

    - name: Build
      shell: msys2 {0}
      run: |
        cd windows/mingw-w64-libnacs-git
        MAKEFLAGS="-j$(nproc)" MINGW_ARCH=MINGW64 bash ../../github/build-package.sh msys2/mingw64 makepkg-mingw

    - name: "Upload binaries"
      uses: actions/upload-artifact@v7
      with:
        name: mingw-w64-x86_64-libnacs-git-package-msys2
        path: |
          windows/mingw-w64-libnacs-git/*.pkg.tar.*
          windows/mingw-w64-libnacs-git/PKGBUILD

  # The same architecture independent package is built for all platforms
  # from `arch/nacs-keyring` (`windows/nacs-keyring` is a symlink to it).
  build-keyring:
    name: Build nacs-keyring
    if: ${{ !inputs.build || contains(format(' {0} ', inputs.build), ' nacs-keyring ') }}
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Initialize ArchLinux
        run: |
          bash github/setup-archlinux.sh
          chown -R user .
      - name: Create package
        run: |
          cd arch/nacs-keyring
          if [[ ! -f nacs.gpg ]]; then
              echo "::warning::No keys in nacs-keyring yet, see github/update-keyring.sh"
              exit 0
          fi
          sudo -u user --preserve-env=GITHUB_SERVER_URL,GITHUB_REPOSITORY \
              bash ../../github/build-package.sh msys2/mingw64 makepkg --noconfirm

      - name: "Upload binaries"
        uses: actions/upload-artifact@v7
        with:
          name: nacs-keyring-package-msys2
          path: |
            arch/nacs-keyring/*.pkg.*
            arch/nacs-keyring/PKGBUILD
