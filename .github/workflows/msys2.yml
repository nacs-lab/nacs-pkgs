name: MSYS2

on:
  workflow_dispatch:
  pull_request:
    branches: [ master ]
  workflow_call:
    inputs:
      ref:
        description: Commit to build
        type: string
      build:
        description: >-
          Space separated list of packages to build.
          Other packages are taken from the package repository.
        type: string
      msystem:
        description: MSYS2 environment to build for (MINGW64, UCRT64 or CLANG64). All by default.
        type: string

env:
  PACKAGER: "Ni Lab <niharvardlab@gmail.com>"

jobs:
  setup:
    name: Environments
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Select environments
        id: matrix
        env:
          MSYSTEM: ${{ inputs.msystem }}
        run: |
          # platform: name of the platform in the update workflow and the artifacts
          # repo: directory of the package repository under `msys2/`
          all='[
            {"msystem": "MINGW64", "prefix": "mingw-w64-x86_64", "repo": "mingw64",
             "platform": "msys2", "cc": "gcc", "cxx": "g++"},
            {"msystem": "UCRT64", "prefix": "mingw-w64-ucrt-x86_64", "repo": "ucrt64",
             "platform": "msys2-ucrt64", "cc": "gcc", "cxx": "g++"},
            {"msystem": "CLANG64", "prefix": "mingw-w64-clang-x86_64", "repo": "clang64",
             "platform": "msys2-clang64", "cc": "clang", "cxx": "clang++"}
          ]'
          matrix=$(jq -c --arg m "$MSYSTEM" '[.[] | select($m == "" or .msystem == $m)]' <<< "$all")
          if [[ $matrix = '[]' ]]; then
              echo "Unknown MSYS2 environment $MSYSTEM" >&2
              exit 1
          fi
          echo "matrix={\"include\":$matrix}" >> "$GITHUB_OUTPUT"

  build-sleef:
    name: Build Sleef (${{ matrix.msystem }})
    needs: setup
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      BUILD: ${{ !inputs.build || contains(format(' {0} ', inputs.build), ' mingw-w64-sleef-git ') }}
      CC: /${{ matrix.repo }}/bin/${{ matrix.cc }}
      CXX: /${{ matrix.repo }}/bin/${{ matrix.cxx }}

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.ref }}

    - uses: msys2/setup-msys2@v2
      if: env.BUILD == 'true'
      with:
        msystem: ${{ matrix.msystem }}
        install: >-
          git
          make
          patch
        pacboy: >-
          cmake:p
          clang:p
          toolchain:p
          libwinpthread:p

    - name: Build
      if: env.BUILD == 'true'
      shell: msys2 {0}
      run: |
        cd windows/mingw-w64-sleef-git
        MAKEFLAGS="-j$(nproc)" MINGW_ARCH=${{ matrix.msystem }} bash ../../github/build-package.sh msys2/${{ matrix.repo }} makepkg-mingw

    - name: Fetch published package
      if: env.BUILD != 'true'
      shell: bash
      run: |
        bash github/fetch-published.sh msys2/${{ matrix.repo }} windows/mingw-w64-sleef-git '${{ matrix.prefix }}-sleef-git-*'

    - name: "Upload binaries"
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.prefix }}-sleef-git-package-${{ matrix.platform }}
        path: |
          windows/mingw-w64-sleef-git/*.pkg.tar.*
          windows/mingw-w64-sleef-git/PKGBUILD

  build-libnacs:
    name: Build libnacs (${{ matrix.msystem }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    needs: [setup, build-sleef]
    if: ${{ !inputs.build || contains(format(' {0} ', inputs.build), ' mingw-w64-libnacs-git ') }}
    env:
      CC: /${{ matrix.repo }}/bin/${{ matrix.cc }}
      CXX: /${{ matrix.repo }}/bin/${{ matrix.cxx }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.ref }}

    - uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.msystem }}
        install: >-
          git
          make
          patch
        pacboy: >-
          cmake:p
          clang:p
          cppzmq:p
          toolchain:p
          tbb:p
          libwinpthread:p
          llvm:p
          openlibm:p
          polly:p
          yaml-cpp:p
          zeromq:p

    - name: Download Sleef
      uses: actions/download-artifact@v8
      with:
        name: ${{ matrix.prefix }}-sleef-git-package-${{ matrix.platform }}
        path: sleef-package

    - name: Install Sleef
      shell: msys2 {0}
      run: |
        pacman -U --noconfirm sleef-package/*.pkg.tar.*

    - name: Build
      shell: msys2 {0}
      run: |
        cd windows/mingw-w64-libnacs-git
        MAKEFLAGS="-j$(nproc)" MINGW_ARCH=${{ matrix.msystem }} bash ../../github/build-package.sh msys2/${{ matrix.repo }} makepkg-mingw

    - name: "Upload binaries"
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.prefix }}-libnacs-git-package-${{ matrix.platform }}
        path: |
          windows/mingw-w64-libnacs-git/*.pkg.tar.*
          windows/mingw-w64-libnacs-git/PKGBUILD

  # The same architecture independent package is built for all platforms
  # from `arch/nacs-keyring` (`windows/nacs-keyring` is a symlink to it).
  build-keyring:
    name: Build nacs-keyring (${{ matrix.msystem }})
    needs: setup
    if: ${{ !inputs.build || contains(format(' {0} ', inputs.build), ' nacs-keyring ') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    container:
      image: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Initialize ArchLinux
        run: |
          bash github/setup-archlinux.sh
          chown -R user .
      - name: Create package
        run: |
          cd arch/nacs-keyring
          if [[ ! -f nacs.gpg ]]; then
              echo "::warning::No keys in nacs-keyring yet, see github/update-keyring.sh"
              exit 0
          fi
          sudo -u user --preserve-env=GITHUB_SERVER_URL,GITHUB_REPOSITORY \
              bash ../../github/build-package.sh msys2/${{ matrix.repo }} makepkg --noconfirm

      - name: "Upload binaries"
        uses: actions/upload-artifact@v7
        with:
          name: nacs-keyring-package-${{ matrix.platform }}
          path: |
            arch/nacs-keyring/*.pkg.*
            arch/nacs-keyring/PKGBUILD
