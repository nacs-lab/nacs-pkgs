name: Release

on:
  push:
    tags:
    - '*'

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Checkout published packages
      uses: actions/checkout@v7
      with:
        ref: gh-pages
        path: pages

    - name: Download Ubuntu packages
      uses: dawidd6/action-download-artifact@v27
      with:
        workflow: ubuntu.yml
        workflow_conclusion: success
        branch: master

    - name: Install dependencies
      run: sudo apt-get install tar zip zstd

    - name: Create archlinux package tarball
      run: |
        mkdir archlinux-packages
        mv pages/archlinux/x86_64/*.pkg.tar.* archlinux-packages/
        tar -cvf archlinux-packages.tar.zst --zstd archlinux-packages/

    - name: Create archlinux-arm package tarball
      run: |
        mkdir archlinux-arm-packages
        mv pages/archlinux/armv7h/*.pkg.tar.* archlinux-arm-packages/
        tar -cvf archlinux-arm-packages.tar.zst --zstd archlinux-arm-packages/

    - name: Create msys2 package tarball
      run: |
        mkdir msys2-packages
        mv pages/msys2/mingw64/*.pkg.tar.* msys2-packages/
        zip -r msys2-packages.zip msys2-packages/

    - name: Create ubuntu package tarball
      run: |
        for ver in 22.04 24.04 26.04; do
            mkdir ubuntu-${ver}-packages
            mv *-package-ubuntu-${ver}/*.deb ubuntu-${ver}-packages/
            tar -cvf ubuntu-${ver}-packages.tar.zst --zstd ubuntu-${ver}-packages/
        done

    - name: Tag release
      uses: ncipollo/release-action@v1
      with:
        artifacts: archlinux-packages.tar.zst,archlinux-arm-packages.tar.zst,msys2-packages.zip,ubuntu-22.04-packages.tar.zst,ubuntu-24.04-packages.tar.zst,ubuntu-26.04-packages.tar.zst
        body: Packages
        token: ${{ secrets.GITHUB_TOKEN }}
